[project]
name = "famsun-agent"
version = "1.0.0"
description = "FAMSUN multi-user agent workspace powered by OpenAI Agents SDK"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1", "openai-agents>=0.9,<1", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["B008"] # FastAPI resolves these dependency markers; they are not mutable defaults.
"backend/app/service.py" = ["BLE001"] # Run boundary redacts provider exceptions before persistence.
