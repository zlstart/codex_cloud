name: famsun-agent
services:
  app:
    build: .
    image: famsun-agent:latest
    user: "${FAMSUN_UID:-1000}:${FAMSUN_GID:-1000}"
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the host Docker socket group}"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_DIR: ${DATA_DIR:?Set DATA_DIR to an absolute host path}
      PORT: "8000"
      SANDBOX_BACKEND: docker
      FAMSUN_SANDBOX_IMAGE: ${FAMSUN_SANDBOX_IMAGE:-famsun-sandbox:latest}
      # The API and its per-chat bind mounts use the same nonroot identity.
      FAMSUN_SANDBOX_UID: ${FAMSUN_UID:-1000}
      FAMSUN_SANDBOX_GID: ${FAMSUN_GID:-1000}
    volumes:
      # Same absolute path is essential: sibling sandboxes are created by the host daemon.
      - type: bind
        source: ${DATA_DIR:?Set an absolute DATA_DIR}
        target: ${DATA_DIR:?Set an absolute DATA_DIR}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
